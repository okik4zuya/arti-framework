<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Multi-panel figure</title>
<!-- size/mode are read by compose.py: 2-column width 190 mm. Edit, then:
     python.exe tools/arti-compose/compose.py --src figures/src/<this file> --out-dir figures -->
<meta name="arti:width" content="190mm">
<meta name="arti:height" content="110mm">
<meta name="arti:dpi" content="600">
<meta name="arti:min-pt" content="7">
<style>
/*ARTI_BASE_CSS*/
/* layout for this figure: 2 columns, panel (a) spans the top row */
.sheet { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }
.span2 { grid-column: 1 / span 2; }
</style>
</head>
<body>
<div class="sheet">
  <!-- Photos, micrographs and blots: label, add a scale bar, or crop (and say so in the caption). Never retouch. -->
  <figure class="panel span2" style="margin:0"><span class="tag">(a)</span><img src="PANEL_A.svg" alt="panel a"></figure>
  <figure class="panel" style="margin:0"><span class="tag">(b)</span><img src="PANEL_B.png" alt="panel b"></figure>
  <figure class="panel" style="margin:0"><span class="tag">(c)</span><img src="PANEL_C.png" alt="panel c">
    <div class="scalebar"><i style="width:10mm"></i>200 nm</div></figure>
</div>
</body>
</html>

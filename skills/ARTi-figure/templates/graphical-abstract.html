<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Graphical abstract</title>
<!-- Fixed pixel size (1328 x 531 px is a common minimum). At 13 cm wide 24 px is about 6.8 pt, so ALL text
     (also text inside SVG) must be >= 24 px; compose.py warns below arti:min-px.
     python.exe tools/arti-compose/compose.py --src figures/src/<this file> --out-dir figures -->
<meta name="arti:width" content="1328px">
<meta name="arti:height" content="531px">
<meta name="arti:min-px" content="24">
<!-- Text rule: no sentences that explain the picture; only a title, 1-2 word labels, numbers, one takeaway phrase. -->

<style>
/*ARTI_BASE_CSS*/
:root { --fs-label: 32px; --fs-body: 26px; --fs-small: 24px; --stroke: 2px; }
.ga { width: var(--page-w); height: var(--page-h); display: grid; grid-template-columns: 1fr 120px 1fr 120px 1fr;
      align-items: center; padding: 30px 40px; gap: 0; }
.zone { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; }
.zone h2 { margin: 0; font-size: var(--fs-label); }
.zone p { margin: 0; font-size: var(--fs-body); text-align: center; }
.arrow { width: 100%; }
</style>
</head>
<body>
<div class="ga">
  <div class="zone"><h2>Input</h2><svg width="200" height="200" viewBox="0 0 200 200"><circle cx="100" cy="100" r="70" fill="#ddd" stroke="#000" stroke-width="2"/></svg><p>Label</p></div>
  <svg class="arrow" viewBox="0 0 120 40"><defs><marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z"/></marker></defs><line x1="5" y1="20" x2="105" y2="20" stroke="#000" stroke-width="3" marker-end="url(#ah)"/></svg>
  <div class="zone"><h2>Process</h2><svg width="200" height="200" viewBox="0 0 200 200"><rect x="30" y="30" width="140" height="140" fill="#4D4D4D"/></svg><p>Label</p></div>
  <svg class="arrow" viewBox="0 0 120 40"><line x1="5" y1="20" x2="105" y2="20" stroke="#000" stroke-width="3" marker-end="url(#ah)"/></svg>
  <div class="zone"><h2>Result</h2><svg width="200" height="200" viewBox="0 0 200 200"><polygon points="100,20 180,170 20,170" fill="#2b6cb0"/></svg><p>Label</p></div>
</div>
</body>
</html>
